<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "secondary-container": "#5b2d94",
              "on-primary": "#340090",
              "primary": "#b6a0ff",
              "surface-container-low": "#101126",
              "on-primary-fixed": "#000000",
              "on-error-container": "#ffb2b9",
              "on-secondary-fixed": "#471580",
              "secondary-dim": "#b688f3",
              "surface-container-lowest": "#000000",
              "error-dim": "#d73357",
              "inverse-primary": "#6834eb",
              "on-tertiary-container": "#59002e",
              "on-tertiary": "#690939",
              "tertiary-fixed-dim": "#f57ca9",
              "primary-fixed": "#a98fff",
              "surface": "#0b0c1f",
              "tertiary": "#ff96bb",
              "on-tertiary-fixed-variant": "#70103e",
              "secondary-fixed-dim": "#d6b6ff",
              "error-container": "#a70138",
              "outline": "#73738b",
              "on-tertiary-fixed": "#37001a",
              "on-error": "#490013",
              "secondary": "#bc8df9",
              "on-secondary-fixed-variant": "#65389f",
              "on-primary-container": "#280072",
              "surface-container-high": "#1c1d36",
              "inverse-on-surface": "#535369",
              "on-surface-variant": "#a9a9c2",
              "error": "#ff6e84",
              "on-surface": "#e4e3fe",
              "surface-dim": "#0b0c1f",
              "surface-bright": "#282947",
              "tertiary-dim": "#ee77a3",
              "primary-container": "#a98fff",
              "on-background": "#e4e3fe",
              "background": "#0b0c1f",
              "on-secondary": "#36006c",
              "on-secondary-container": "#e0c5ff",
              "surface-container-highest": "#22233e",
              "inverse-surface": "#fbf8ff",
              "primary-fixed-dim": "#9c7eff",
              "secondary-fixed": "#e1c7ff",
              "primary-dim": "#7e51ff",
              "on-primary-fixed-variant": "#32008a",
              "tertiary-container": "#fb81ae",
              "surface-container": "#16172e",
              "outline-variant": "#46465b",
              "surface-tint": "#b6a0ff",
              "tertiary-fixed": "#ff8db6",
              "surface-variant": "#22233e"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #0b0c1f;
            color: #e4e3fe;
            font-family: 'Inter', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen pb-24">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 bg-[#101126] shadow-[0_12px_24px_-4px_rgba(124,77,255,0.08)]">
<div class="flex items-center justify-between px-6 py-4 w-full max-w-7xl mx-auto">
<div class="flex items-center gap-4">
<button class="active:scale-95 transition-transform duration-200 text-[#7C4DFF] hover:bg-[#22233e] p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Manrope'] text-[#e4e3fe] tracking-wide font-bold text-xl">New Task</h1>
</div>
<button class="active:scale-95 transition-transform duration-200 bg-gradient-to-br from-[#7e51ff] to-[#b6a0ff] text-white px-6 py-2 rounded-full font-bold shadow-lg">
                Save
            </button>
</div>
</header>
<main class="px-6 py-8 max-w-2xl mx-auto space-y-8">
<!-- Hero Section / Context -->
<div class="space-y-2">
<p class="font-['Inter'] text-[#a9a9c2] text-sm uppercase tracking-widest font-medium">Task Entry</p>
<h2 class="font-['Manrope'] text-3xl font-extrabold text-[#e4e3fe]">Define your flow</h2>
</div>
<!-- Form Layout -->
<div class="space-y-6">
<!-- Title Field -->
<div class="group space-y-2">
<label class="block text-sm font-medium text-[#a9a9c2] ml-1">Title</label>
<div class="relative bg-surface-container-lowest rounded-xl border border-outline-variant/15 focus-within:border-primary transition-all duration-300">
<input class="w-full bg-transparent border-none text-[#e4e3fe] placeholder-[#73738b] focus:ring-0 px-4 py-4 font-body" placeholder="What needs to be done?" type="text"/>
</div>
</div>
<!-- Description Field -->
<div class="group space-y-2">
<label class="block text-sm font-medium text-[#a9a9c2] ml-1">Description</label>
<div class="relative bg-surface-container-lowest rounded-xl border border-outline-variant/15 focus-within:border-primary transition-all duration-300">
<textarea class="w-full bg-transparent border-none text-[#e4e3fe] placeholder-[#73738b] focus:ring-0 px-4 py-4 font-body resize-none" placeholder="Add more details about this task..." rows="4"></textarea>
</div>
</div>
<!-- Grid for shorter inputs -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Due Date -->
<div class="group space-y-2">
<label class="block text-sm font-medium text-[#a9a9c2] ml-1">Due Date</label>
<div class="relative flex items-center bg-surface-container-lowest rounded-xl border border-outline-variant/15 focus-within:border-primary transition-all duration-300">
<span class="material-symbols-outlined ml-4 text-[#7C4DFF]" data-icon="calendar_today">calendar_today</span>
<input class="w-full bg-transparent border-none text-[#e4e3fe] placeholder-[#73738b] focus:ring-0 px-3 py-4 font-body" placeholder="Select date" type="text"/>
</div>
</div>
<!-- Status -->
<div class="group space-y-2">
<label class="block text-sm font-medium text-[#a9a9c2] ml-1">Status</label>
<div class="relative bg-surface-container-lowest rounded-xl border border-outline-variant/15 focus-within:border-primary transition-all duration-300">
<select class="w-full bg-transparent border-none text-[#e4e3fe] focus:ring-0 px-4 py-4 font-body appearance-none cursor-pointer">
<option class="bg-surface-container-high" selected="">To-Do</option>
<option class="bg-surface-container-high">In Progress</option>
<option class="bg-surface-container-high">Done</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-[#a9a9c2]" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<!-- Blocked By (Visual Highlight) -->
<div class="group space-y-2">
<label class="block text-sm font-medium text-[#a9a9c2] ml-1">Blocked By</label>
<div class="relative flex items-center bg-surface-container-lowest rounded-xl border border-outline-variant/15 focus-within:border-primary transition-all duration-300">
<span class="material-symbols-outlined ml-4 text-tertiary" data-icon="lock" style="font-variation-settings: 'FILL' 1;">lock</span>
<select class="w-full bg-transparent border-none text-[#e4e3fe] focus:ring-0 px-3 py-4 font-body appearance-none cursor-pointer">
<option class="bg-surface-container-high" selected="">Select a blocking task (optional)</option>
<option class="bg-surface-container-high">Project Initialization</option>
<option class="bg-surface-container-high">Design System Audit</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-[#a9a9c2]" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<!-- Optional Priority Chips -->
<div class="pt-4 space-y-3">
<h3 class="text-xs font-bold uppercase tracking-widest text-[#a9a9c2]">Priority Level</h3>
<div class="flex flex-wrap gap-3">
<button class="px-5 py-2 rounded-full bg-primary text-on-primary font-semibold text-sm transition-transform active:scale-95">High</button>
<button class="px-5 py-2 rounded-full bg-surface-container-highest text-[#a9a9c2] font-semibold text-sm hover:text-[#e4e3fe] transition-all">Medium</button>
<button class="px-5 py-2 rounded-full bg-surface-container-highest text-[#a9a9c2] font-semibold text-sm hover:text-[#e4e3fe] transition-all">Low</button>
</div>
</div>
</main>
<!-- BottomNavBar (Suppressed for focused task creation as per Shell Visibility Rule, but maintaining for ecosystem context if needed. Here we follow 'Task-Focused' suppression but provide a similar styled interaction for secondary actions if required. Actually, based on logic, we suppress for focused journeys. Adding a floating helper instead.) -->
<!-- Floating Attachment Button (Consistent with Contextual FAB rules) -->
<div class="fixed bottom-8 right-6">
<button class="flex items-center justify-center bg-surface-variant/60 backdrop-blur-xl text-[#e4e3fe] w-14 h-14 rounded-full shadow-[0_12px_24px_-4px_rgba(124,77,255,0.15)] active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined" data-icon="attach_file">attach_file</span>
</button>
</div>
<!-- BottomNavBar as Ghost Element for navigation flow consistency -->
<nav class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[90%] rounded-[3rem] z-50 bg-[#16172e]/60 backdrop-blur-xl shadow-[0_12px_24px_-4px_rgba(124,77,255,0.15)] md:hidden">
<div class="flex justify-around items-center h-20 px-4">
<a class="flex items-center justify-center text-[#a9a9c2] p-3 hover:text-[#e4e3fe] transition-all" href="#">
<span class="material-symbols-outlined" data-icon="grid_view">grid_view</span>
</a>
<a class="flex items-center justify-center bg-gradient-to-br from-[#7e51ff] to-[#b6a0ff] text-white rounded-full p-3 active:scale-90 transition-all duration-200" href="#">
<span class="material-symbols-outlined" data-icon="assignment">assignment</span>
</a>
<a class="flex items-center justify-center text-[#a9a9c2] p-3 hover:text-[#e4e3fe] transition-all" href="#">
<span class="material-symbols-outlined" data-icon="calendar_today">calendar_today</span>
</a>
<a class="flex items-center justify-center text-[#a9a9c2] p-3 hover:text-[#e4e3fe] transition-all" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
</a>
</div>
</nav>
</body></html>
