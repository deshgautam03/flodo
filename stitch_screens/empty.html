</button>
<h1 class="text-[#e4e3fe] font-black tracking-widest uppercase font-['Manrope'] tracking-tight text-xl">Flodo</h1>
</div>
<div class="flex items-center gap-2">
<button class="text-[#a9a9c2] hover:bg-[#16172e] transition-colors active:scale-95 duration-200 p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="search">search</span>
</button>
<div class="w-8 h-8 rounded-full overflow-hidden border border-outline-variant/20 active:scale-95 transition-transform duration-200 cursor-pointer">

</div>
</div>

<!-- Main Canvas (Empty State) -->
<main class="flex-grow flex flex-col items-center justify-center px-8 pt-16 pb-24 text-center">
<!-- Editorial Empty State Illustration -->
<div class="relative mb-10 group">
<!-- Background Glow -->
<div class="absolute inset-0 bg-primary/20 blur-[60px] rounded-full scale-110 opacity-50"></div>
<!-- Glass Icon Container -->
<div class="relative w-48 h-48 bg-surface-container/40 backdrop-blur-2xl rounded-lg flex items-center justify-center border border-outline-variant/10 shadow-[0_12px_24px_-4px_rgba(124,77,255,0.08)]">
<div class="relative">
<span class="material-symbols-outlined text-[100px] text-primary" data-icon="assignment" style="font-variation-settings: 'FILL' 1;">assignment</span>
<div class="absolute -top-2 -right-2 w-10 h-10 bg-tertiary-dim rounded-full flex items-center justify-center shadow-lg border-4 border-surface">
<span class="material-symbols-outlined text-on-tertiary text-xl" data-icon="add">add</span>
</div>
</div>
</div>
</div>
<!-- Typography Content -->
<h2 class="font-headline text-3xl font-bold text-on-surface mb-3 tracking-tight">No Tasks Yet</h2>
<p class="font-body text-on-surface-variant max-w-[280px] leading-relaxed opacity-70 mb-10">Tap the + button to create your first task and start your journey.</p>
<!-- CTA Button -->
<button class="group flex items-center gap-3 px-8 py-4 rounded-DEFAULT border border-primary/40 hover:border-primary text-primary font-medium transition-all active:scale-95 hover:bg-primary/5">
<span class="material-symbols-outlined" data-icon="add_task">add_task</span>
<span>Create Task</span>
</button>

<button class="fixed right-6 bottom-24 w-16 h-16 bg-gradient-to-br from-[#7e51ff] to-[#b6a0ff] text-white rounded-full flex items-center justify-center shadow-[0_12px_24px_-4px_rgba(124,77,255,0.3)] active:scale-90 transition-transform z-40">
<span class="material-symbols-outlined text-3xl" data-icon="add">add</span>
</button>
<!-- BottomNavBar -->
<nav class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[92%] rounded-[3rem] z-50 bg-[#16172e]/60 backdrop-blur-xl flex justify-around items-center p-2 shadow-[0_12px_24px_-4px_rgba(124,77,255,0.08)] no-border">
<!-- Tasks (Active) -->
<a class="flex flex-col items-center justify-center bg-gradient-to-br from-[#7e51ff] to-[#b6a0ff] text-white rounded-full px-6 py-2 transition-transform active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="assignment" style="font-variation-settings: 'FILL' 1;">assignment</span>
<span class="font-['Inter'] text-[11px] font-medium uppercase tracking-wider mt-0.5">Tasks</span>
</a>

<a class="flex flex-col items-center justify-center text-[#a9a9c2] opacity-70 hover:opacity-100 transition-transform active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="calendar_today">calendar_today</span>
<span class="font-['Inter'] text-[11px] font-medium uppercase tracking-wider mt-0.5">Calendar</span>
</a>

<span class="material-symbols-outlined" data-icon="adjust">adjust</span>
<span class="font-['Inter'] text-[11px] font-medium uppercase tracking-wider mt-0.5">Focus</span>
</a>

<a class="flex flex-col items-center justify-center text-[#a9a9c2] opacity-70 hover:opacity-100 transition-transform active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-['Inter'] text-[11px] font-medium uppercase tracking-wider mt-0.5">Settings</span>
</a>
